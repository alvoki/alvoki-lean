name: Correctness

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runtime:
        description: Run the opt-in runtime prototype checks
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  stock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: bash scripts/bootstrap.sh "$RUNNER_TEMP/alvoki-toolchains"
      - run: ALVOKI_TOOLCHAINS="$RUNNER_TEMP/alvoki-toolchains" bash scripts/check.sh

  runtime:
    if: github.event_name == 'workflow_dispatch' && inputs.runtime
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: bash scripts/bootstrap.sh "$RUNNER_TEMP/alvoki-toolchains"
      - run: ALVOKI_TOOLCHAINS="$RUNNER_TEMP/alvoki-toolchains" bash scripts/check.sh --runtime
